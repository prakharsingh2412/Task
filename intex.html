<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>6‑Month Master Syllabus Dashboard (persistent, starts at 0)</title>
  <style>
    /* ================= DESIGN TOKENS ================= */
    :root {
      --ff-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --ff-mono: "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;

      --spacing-xxs: 2px;
      --spacing-xs: 4px;
      --spacing-s: 8px;
      --spacing-m: 12px;
      --spacing-l: 16px;
      --spacing-xl: 20px;
      --spacing-xxl: 24px;

      --shape-none: 0px;
      --shape-xs: 4px;
      --shape-s: 8px;
      --shape-m: 12px;
      --shape-l: 16px;
      --shape-xl: 24px;
      --shape-full: 999px;

      --surface: #fdfcfc;
      --surface-dim: #f2f0f0;
      --surface-bright: #ffffff;
      --surface-container: #f2f0f0;
      --surface-container-high: #e6e6e6;
      --on-surface: #000000;
      --on-surface-variant: rgba(0, 0, 0, 0.55);
      --on-surface-low: rgba(0, 0, 0, 0.08);
      --primary: #3186ff;
      --accent: #9dd2ff;
      --accent-container: #dcf1ff;
      --accent-fixed: #3186ff;
      --stroke-default: #e3e3e3;
      --outline: #727676;
      --positive: #008052;
      --error: #de2d29;
    }

    :root[data-theme="dark"] {
      --surface: #0f0f0f;
      --surface-dim: #141414;
      --surface-bright: #1c1c1c;
      --surface-container: #141414;
      --surface-container-high: #1c1c1c;
      --on-surface: #e0e0e0;
      --on-surface-variant: rgba(255, 255, 255, 0.55);
      --on-surface-low: rgba(255, 255, 255, 0.12);
      --primary: #9dd2ff;
      --accent: #1f3b9b;
      --accent-container: #192967;
      --accent-fixed: #3186ff;
      --stroke-default: #2d2f38;
      --outline: #9a9b9c;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --surface: #0f0f0f;
        --surface-dim: #141414;
        --surface-bright: #1c1c1c;
        --surface-container: #141414;
        --surface-container-high: #1c1c1c;
        --on-surface: #e0e0e0;
        --on-surface-variant: rgba(255, 255, 255, 0.55);
        --on-surface-low: rgba(255, 255, 255, 0.12);
        --primary: #9dd2ff;
        --accent: #1f3b9b;
        --accent-container: #192967;
        --accent-fixed: #3186ff;
        --stroke-default: #2d2f38;
        --outline: #9a9b9c;
      }
    }

    /* ================= RESET & BASE ================= */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: transparent;
      color: var(--on-surface);
      font-family: var(--ff-sans);
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ================= LAYOUT ================= */
    .widget-container {
      width: 100%;
      min-height: 280px;
      padding: var(--spacing-m);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-m);
    }

    .header-card {
      background: var(--surface-bright);
      border-radius: var(--shape-m);
      padding: var(--spacing-l);
      border: 1px solid var(--stroke-default);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-s);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: var(--spacing-m);
      flex-wrap: wrap;
    }

    .header-titles {
      flex: 1;
      min-width: 240px;
    }

    .header-titles h2 {
      font-size: 24px;
      line-height: 28px;
      font-weight: 600;
      margin: 0;
      color: var(--on-surface);
    }

    .header-titles p {
      margin: 4px 0 0 0;
      font-size: 13px;
      color: var(--on-surface-variant);
    }

    .header-actions {
      display: flex;
      gap: var(--spacing-s);
      align-items: center;
    }

    .print-btn {
      padding: 6px 14px;
      font-size: 13px;
      background: var(--accent-container);
      color: var(--accent-fixed);
      border: 1px solid var(--primary);
      border-radius: var(--shape-full);
      cursor: pointer;
      font-weight: 600;
      font-family: var(--ff-sans);
      transition: background 0.15s;
    }

    .print-btn:hover {
      background: var(--primary);
      color: #fff;
    }

    .progress-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 4px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--on-surface-variant);
      font-family: var(--ff-mono);
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--surface-dim);
      border-radius: var(--shape-full);
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: var(--primary);
      transition: width 0.3s ease;
      border-radius: var(--shape-full);
    }

    .controls-card {
      background: var(--surface-dim);
      border-radius: var(--shape-m);
      padding: var(--spacing-m);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-m);
      border: 1px solid var(--stroke-default);
    }

    .search-row {
      display: flex;
      gap: var(--spacing-s);
      align-items: center;
    }

    .search-input {
      width: 100%;
      padding: 8px 14px;
      border-radius: var(--shape-full);
      border: 1px solid var(--stroke-default);
      background: var(--surface-bright);
      color: var(--on-surface);
      font-size: 14px;
      font-family: var(--ff-sans);
      outline: none;
      transition: border-color 0.15s;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .tabs-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 6px 14px;
      border-radius: var(--shape-full);
      font-size: 13px;
      font-weight: 500;
      background: var(--surface-bright);
      color: var(--on-surface-variant);
      border: 1px solid var(--stroke-default);
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
      font-family: var(--ff-sans);
    }

    .tab-btn:hover {
      background: var(--surface-container-high);
      color: var(--on-surface);
    }

    .tab-btn.is-active {
      background: var(--accent-container);
      color: var(--accent-fixed);
      border-color: var(--primary);
      font-weight: 600;
    }

    .content-area {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-m);
    }

    .week-group {
      background: var(--surface-bright);
      border-radius: var(--shape-m);
      border: 1px solid var(--stroke-default);
      overflow: hidden;
    }

    .week-header {
      padding: 12px 16px;
      background: var(--surface-dim);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      font-size: 14px;
      font-weight: 600;
      border-bottom: 1px solid var(--stroke-default);
      font-family: var(--ff-sans);
    }

    .week-header:hover {
      background: var(--surface-container-high);
    }

    .week-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .week-toggle-icon {
      font-family: var(--ff-mono);
      font-size: 12px;
      color: var(--on-surface-variant);
    }

    .week-meta {
      font-family: var(--ff-mono);
      font-size: 12px;
      color: var(--on-surface-variant);
    }

    .day-list {
      display: flex;
      flex-direction: column;
    }

    .day-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--stroke-default);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .day-item:last-child {
      border-bottom: none;
    }

    .day-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .day-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .day-badge {
      font-family: var(--ff-mono);
      font-size: 12px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: var(--shape-xs);
      background: var(--surface-dim);
      color: var(--on-surface-variant);
      border: 1px solid var(--stroke-default);
    }

    .track-badge {
      font-size: 12px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: var(--shape-xs);
      background: var(--accent-container);
      color: var(--accent-fixed);
    }

    .day-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--on-surface);
      margin: 0;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-left: 4px;
    }

    .task-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 13px;
      color: var(--on-surface);
      cursor: pointer;
      user-select: none;
    }

    .task-checkbox {
      appearance: none;
      width: 16px;
      height: 16px;
      border: 1.5px solid var(--outline);
      border-radius: 4px;
      margin-top: 2px;
      cursor: pointer;
      display: grid;
      place-content: center;
      outline: none;
      background: var(--surface-bright);
      flex-shrink: 0;
    }

    .task-checkbox:checked {
      background: var(--primary);
      border-color: var(--primary);
    }

    .task-checkbox:checked::before {
      content: "✓";
      color: #ffffff;
      font-size: 12px;
      font-weight: bold;
    }

    .task-label {
      line-height: 1.4;
      flex: 1;
    }

    .task-item.is-completed .task-label {
      text-decoration: line-through;
      color: var(--on-surface-variant);
    }

    .empty-state {
      padding: 32px 16px;
      text-align: center;
      color: var(--on-surface-variant);
      background: var(--surface-dim);
      border-radius: var(--shape-m);
      border: 1px solid var(--stroke-default);
    }

    /* ================= STUDY RESOURCES ================= */
    .study-resources {
      margin-top: 8px;
      padding: 10px 12px;
      background: var(--surface-dim);
      border: 1px solid var(--stroke-default);
      border-radius: var(--shape-s);
    }

    .study-resources-title {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 7px;
      color: var(--on-surface);
    }

    .study-resource-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .study-resource-link {
      display: inline-flex;
      align-items: center;
      padding: 5px 9px;
      border-radius: var(--shape-full);
      border: 1px solid var(--primary);
      background: var(--accent-container);
      color: var(--accent-fixed);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
    }

    .study-resource-link:hover {
      opacity: .82;
      transform: translateY(-1px);
    }

    /* ================= SCROLLBAR ================= */
    * {
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 0, 0, 0.2) transparent;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background-color: rgba(0, 0, 0, 0.2);
      border-radius: var(--shape-full);
    }

    :root[data-theme="dark"] * {
      scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
    }

    :root[data-theme="dark"] ::-webkit-scrollbar-thumb {
      background-color: rgba(255, 255, 255, 0.2);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) * {
        scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
      }

      :root:not([data-theme="light"]) ::-webkit-scrollbar-thumb {
        background-color: rgba(255, 255, 255, 0.2);
      }
    }

    /* ================= PRINT ================= */
    @media print {
      body {
        background: #ffffff !important;
        color: #000000 !important;
        font-size: 11pt;
      }

      .no-print,
      .controls-card,
      .header-actions {
        display: none !important;
      }

      .widget-container {
        padding: 0 !important;
      }

      .header-card,
      .week-group {
        border: 1px solid #ccc !important;
        box-shadow: none !important;
        page-break-inside: avoid;
        margin-bottom: 12px;
      }

      .task-checkbox {
        border-color: #000 !important;
      }

      .week-group-content {
        display: block !important;
      }
    }
  </style>
</head>

<body>
  <div class="widget-container">
    <!-- HEADER -->
    <div class="header-card">
      <div class="header-top">
        <div class="header-titles">
          <h2>6-Month Master Syllabus Dashboard</h2>
          <p>Complete 168-Day Roadmap with deep study resources: Django, React+TS, Postgres, Redis, Docker, AWS, System Design, Go, Startup & YouTube</p>
        </div>
        <div class="header-actions no-print">
          <button id="printBtn" class="print-btn">Print / Save PDF</button>
        </div>
      </div>

      <div class="progress-section">
        <div class="progress-info">
          <span id="progressText">Overall Progress: 0 / 0 tasks completed</span>
          <span id="progressPct" style="font-weight: 600;">0%</span>
        </div>
        <div class="progress-track">
          <div id="progressBarFill" class="progress-fill"></div>
        </div>
      </div>
    </div>

    <!-- CONTROLS -->
    <div class="controls-card no-print">
      <div class="search-row">
        <input type="text" id="searchInput" class="search-input" placeholder="Search topics (e.g. Django ORM, Docker, Redis, Go concurrency)...">
      </div>
      <div class="tabs-row" id="monthTabs">
        <!-- dynamically populated -->
      </div>
    </div>

    <!-- CONTENT -->
    <div id="contentArea" class="content-area">
      <!-- dynamically populated -->
    </div>
  </div>

  <script>
    // ==================== CURRICULUM DATA ====================
    const TRACKS = {
      HTTP: 'HTTP & Web Foundations',
      REACT: 'React & TypeScript',
      DJANGO: 'Django & DRF',
      POSTGRES: 'PostgreSQL',
      REDIS: 'Redis & Caching',
      DOCKER: 'Docker & Linux',
      AWS: 'AWS & Cloud',
      SYS_DESIGN: 'System Design',
      GO: 'Go Language',
      STARTUP: 'Startup & MVP',
      YOUTUBE: 'YouTube & Branding'
    };

    const SYLLABUS_DATA = [];

    function addDay(day, month, week, title, track, tasks) {
      SYLLABUS_DATA.push({ day, month, week, title, track, tasks });
    }

    // ---------- MONTH 1 ----------
    addDay(1, 1, 1, 'Internet Basics & Vite Setup', TRACKS.HTTP, [
      'Map out Internet basics (IP, TCP vs UDP, DNS)',
      'Initialize Vite React + TypeScript project, configure Tailwind CSS',
      'Set up folder structure (src/components, src/services, src/types)',
      'Outline YouTube Video #1: "How Practo Makes Money"'
    ]);
    addDay(2, 1, 1, 'HTTP/HTTPS Lifecycle & TS Interfaces', TRACKS.HTTP, [
      'Master HTTP/HTTPS request-response lifecycle, methods, status codes, headers',
      'Define core TypeScript domain interfaces (Clinic, Doctor, Slot)',
      'Configure react-router-dom'
    ]);
    addDay(3, 1, 1, 'Static React Pages & Web Security Basics', TRACKS.REACT, [
      'Build static mock pages: landing, clinic discovery, doctor profiles',
      'Study Cookies, Sessions, CORS, TLS/SSL'
    ]);
    addDay(4, 1, 1, 'JSON Payloads & API Client Setup', TRACKS.REACT, [
      'Understand JSON payloads and API contract design',
      'Install Axios, configure centralized API client (src/services/api.ts)',
      'Set up mock data states'
    ]);
    addDay(5, 1, 1, 'Customer Discovery & Networking Review', TRACKS.STARTUP, [
      'List local clinic workflow pain points, define target customer',
      'Draft 5 interview questions',
      'Review networking concepts via Postman'
    ]);
    addDay(6, 1, 1, 'YouTube Video #1 & Code Review', TRACKS.YOUTUBE, [
      'Record, edit, publish YouTube Video #1: "How Practo Makes Money: The Business Model Explained"',
      'Review React component code and ensure strict TypeScript compilation'
    ]);
    addDay(7, 1, 1, 'YouTube Video #1 & Code Review', TRACKS.YOUTUBE, [
      'Record, edit, publish YouTube Video #1: "How Practo Makes Money: The Business Model Explained"',
      'Review React component code and ensure strict TypeScript compilation'
    ]);

    addDay(8, 1, 2, 'Monolithic Architecture & Django Init', TRACKS.DJANGO, [
      'Study monolithic request/response lifecycles, MVC, service layers, repository patterns',
      'Initialize Django project alongside React, configure virtualenv, .env, first app (clinics)'
    ]);
    addDay(9, 1, 2, 'Django URLs, FBVs vs CBVs', TRACKS.DJANGO, [
      'Learn Django URLs, Function-Based Views (FBVs) vs Class-Based Views (CBVs)',
      'Write initial views and URL routes for clinic registration and profiles'
    ]);
    addDay(10, 1, 2, 'Middleware, Logging & Error Handling', TRACKS.DJANGO, [
      'Understand Django middleware, request/response hooks, logging, global exception handling',
      'Wire up custom error-handling middleware and handle typed error states in React'
    ]);
    addDay(11, 1, 2, 'Token Auth Concepts & User Model', TRACKS.DJANGO, [
      'Study token authentication, sessions vs tokens, password hashing primitives',
      'Configure Django User model and prepare custom user profiles for doctors/admins'
    ]);
    addDay(12, 1, 2, 'Customer Validation & Django Refactor', TRACKS.STARTUP, [
      'Talk to at least 1 local clinic/practitioner to validate booking slot assumptions',
      'Refactor Django project structure for clean separation of concerns'
    ]);
    addDay(13, 1, 2, 'YouTube Video #2 & CORS Verification', TRACKS.YOUTUBE, [
      'Record, edit, publish YouTube Video #2: "Why Indian Healthcare Startups are Booming"',
      'Consolidate Django routing and verify React-Django CORS communication'
    ]);
    addDay(14, 1, 2, 'YouTube Video #2 & CORS Verification', TRACKS.YOUTUBE, [
      'Record, edit, publish YouTube Video #2: "Why Indian Healthcare Startups are Booming"',
      'Consolidate Django routing and verify React-Django CORS communication'
    ]);

    addDay(15, 1, 3, 'DRF Serializers', TRACKS.DJANGO, [
      'Master DRF Serializers (Serializer vs ModelSerializer), field validation, data serialization',
      'Create serializers for Clinics, Doctors, Appointment slots'
    ]);
    addDay(16, 1, 3, 'DRF APIView, GenericAPIView, ViewSets', TRACKS.DJANGO, [
      'Learn APIView, GenericAPIView, ViewSets, DefaultRouters in DRF',
      'Implement CRUD operations for clinic platform using DRF ViewSets'
    ]);
    addDay(17, 1, 3, 'Permissions, Pagination, Filtering', TRACKS.DJANGO, [
      'Understand object-level permissions, custom permission classes, pagination, filtering, searching',
      'Add custom permission rules so only authenticated clinic owners modify schedules'
    ]);
    addDay(18, 1, 3, 'Media Files & Background Tasks Intro', TRACKS.DJANGO, [
      'Learn media file handling, image storage, asynchronous background tasks',
      'Implement doctor profile picture uploads and store file paths safely'
    ]);
    addDay(19, 1, 3, 'Connect React + TS to DRF Endpoints', TRACKS.REACT, [
      'Connect React + TypeScript frontend to live DRF endpoints, replacing mock data',
      'Use Axios service functions and test end-to-end data fetching'
    ]);
    addDay(20, 1, 3, 'YouTube Video #3 & API Integration Debug', TRACKS.YOUTUBE, [
      'Record, edit, publish YouTube Video #3: "How a Clinic Booking App Actually Works Under the Hood"',
      'Debug API integration issues between TypeScript interfaces and DRF responses'
    ]);
    addDay(21, 1, 3, 'YouTube Video #3 & API Integration Debug', TRACKS.YOUTUBE, [
      'Record, edit, publish YouTube Video #3: "How a Clinic Booking App Actually Works Under the Hood"',
      'Debug API integration issues between TypeScript interfaces and DRF responses'
    ]);

    addDay(22, 1, 4, 'Normalization & Core Schema Design', TRACKS.POSTGRES, [
      'Study normalization (1NF, 2NF, 3NF), primary/foreign keys, unique/check constraints',
      'Design core PostgreSQL schema: Clinics → Doctors → Slots → Appointments'
    ]);
    addDay(23, 1, 4, 'B-tree Indexes & EXPLAIN ANALYZE', TRACKS.POSTGRES, [
      'Learn B-tree indexes, indexing strategies, analyze slow queries using EXPLAIN ANALYZE',
      'Add explicit indexes to high-frequency search fields'
    ]);
    addDay(24, 1, 4, 'Joins, Window Functions, ACID', TRACKS.POSTGRES, [
      'Master inner/outer joins, window functions, group by aggregations, transactions, ACID',
      'Write custom SQL or complex ORM aggregations for clinic daily booking summaries'
    ]);
    addDay(25, 1, 4, 'Connection Pooling, Locks, Isolation', TRACKS.POSTGRES, [
      'Understand connection pooling, database locks (row vs table), transaction isolation levels',
      'Perform database integrity check across local Postgres container'
    ]);
    addDay(26, 1, 4, 'Full MVP Feature Audit', TRACKS.STARTUP, [
      'Run through entire Month 1 MVP feature set: React UI → TS validation → DRF → Django → PostgreSQL',
      'Audit codebase structure'
    ]);
    addDay(27, 1, 4, 'YouTube Video #4 & Month 1 Review', TRACKS.YOUTUBE, [
      'Record, edit, publish YouTube Video #4: "Why Small Clinics Desperately Need Software"',
      'Evaluate weekly time investment and prepare for Month 2'
    ]);
    addDay(28, 1, 4, 'YouTube Video #4 & Month 1 Review', TRACKS.YOUTUBE, [
      'Record, edit, publish YouTube Video #4: "Why Small Clinics Desperately Need Software"',
      'Evaluate weekly time investment and prepare for Month 2'
    ]);

    // ---------- MONTH 2 ----------
    addDay(1, 2, 5, 'JWT Structure & Token Lifetimes', TRACKS.DJANGO, [
      'Understand stateless auth, JWT structure, access vs refresh tokens',
      'Install djangorestframework-simplejwt and configure token lifetimes',
      'Outline YouTube Video #1: "How Practo Handles Millions of Real-Time Appointments"'
    ]);
    addDay(2, 2, 5, 'Password Hashing & Custom User Roles', TRACKS.DJANGO, [
      'Learn cryptographic password hashing (bcrypt), salting, JWT claims',
      'Extend User model with roles (PATIENT, DOCTOR, CLINIC_ADMIN)'
    ]);
    addDay(3, 2, 5, 'Authorization Patterns & Object Permissions', TRACKS.DJANGO, [
      'Study authorization patterns and object-level permissions',
      'Write custom DRF permission classes ensuring only doctors/admins modify slot availabilities'
    ]);
    addDay(4, 2, 5, 'React AuthContext & Axios Interceptors', TRACKS.REACT, [
      'Create React Context (AuthContext) in TypeScript to manage logged-in user state',
      'Configure Axios interceptors to attach Authorization: Bearer <token> headers'
    ]);
    addDay(5, 2, 5, 'Token Refresh & Auth Flow Testing', TRACKS.REACT, [
      'Implement automatic token refreshing on 401 Unauthorized',

    function getStudyResourceKeys(d) {
      const t = (d.title + " " + d.tasks.join(" ")).toLowerCase(), k = [];
      const add = x => { if (STUDY_RESOURCES[x] && !k.includes(x)) k.push(x); };
      if (/goroutine|channel|select statement|worker pool|race detection|concurr/.test(t)) add("goconc");
      if (/net\/http|json serialization|handlers|http server|custom routing/.test(t)) add("goapi");
      if (/go testing|table-driven|httptest/.test(t)) add("gotest");
      if (/go setup|types|variables|constants|pointers|structs|receivers|interfaces|error handling|go semantics/.test(t)) add("go");
      if (/serializer/.test(t)) add("drf");
      if (/apiview|genericapiview|viewsets|router/.test(t)) add("drf");
      if (/permission|authorization|authentication|jwt|token auth/.test(t)) add("drf");
      if (/pagination|filtering|search|throttling/.test(t)) add("drf_adv");
      if (/celery|async task|message broker|periodic task/.test(t)) add("celery");
      if (/media file|file handling|image storage/.test(t)) add("files");
      if (/normalization|schema design|joins|window functions|acid|transaction/.test(t)) add("pg");
      if (/index|explain analyze|query execution/.test(t)) add("pgidx");
      if (/replication|read replica|partitioning|sharding|row locking|locks|isolation/.test(t)) add("pgadv");
      if (/redis core|data structures/.test(t)) add("redis");
      if (/cache invalidation|cache-aside|ttl|caching/.test(t)) add("rediscache");
      if (/distributed lock|redlock|rate limiter/.test(t)) add("redislock");
      if (/linux|file hierarchy|permissions|processes|systemd|log viewing/.test(t)) add("linux");
      if (/ssh|key pair|sshd/.test(t)) add("ssh");
      if (/cron|bash|shell scripting/.test(t)) add("bash");
      if (/osi|tcp\/ip|packet routing|udp|tcp|port binding|netstat|curl|ping/.test(t)) add("net");
      if (/dns|tls|ssl|certificate|let's encrypt|acme/.test(t)) add("tls");

      if (/ssl termination|secure headers|csp|x-frame/.test(t)) add("nginxsec");
      if (/dockerfile|docker core|images|containers|layers|multi-stage/.test(t)) add("docker");

      const all = [], seen = new Set();
      getStudyResourceKeys(d).forEach(key => STUDY_RESOURCES[key].forEach(r => {
        if (!seen.has(r[1])) { seen.add(r[1]); all.push(r); }
      }));
      return `<div class="study-resources"><div class="study-resources-title">📚 Deep study resources</div><div class="study-resource-list">${all.slice(0, 6).map(r => `<a class="study-resource-link" href="${r[1]}" target="_blank" rel="noopener noreferrer">${r[0]} ↗</a>`).join("")}</div></div>`;
    }

    // ==================== STATE & LOCALSTORAGE PERSISTENCE ====================
    const STORAGE_KEY = 'syllabus_dashboard_completed_tasks';

    function loadCompletedTasks() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed)) {
            return new Set(parsed);
          }
        }
      } catch (e) {
        console.warn('Failed to load progress from localStorage', e);
      }
      return new Set();
    }

    function saveCompletedTasks() {
      try {
        const arr = Array.from(state.completedTasks);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
      } catch (e) {
        console.warn('Failed to save progress to localStorage', e);
      }
    }

    const state = {
      selectedMonth: 1,
      searchQuery: '',
      completedTasks: loadCompletedTasks(),
      collapsedWeeks: new Set()
    };

    // ✅ NO SEEDING — starts at 0%

    // ==================== ACTIONS ====================
    function toggleTask(month, day, taskIdx) {
      const key = `${month}-${day}-${taskIdx}`;
      if (state.completedTasks.has(key)) {
        state.completedTasks.delete(key);
      } else {
        state.completedTasks.add(key);
      }
      saveCompletedTasks();
      updateViz();
    }

    function toggleWeek(month, weekInMonth) {
      const key = `${month}-${weekInMonth}`;
      if (state.collapsedWeeks.has(key)) {
        state.collapsedWeeks.delete(key);
      } else {
        state.collapsedWeeks.add(key);
      }
      updateViz();
    }

    function setMonth(m) {
      state.selectedMonth = m;
      updateViz();
    }

    // ==================== RENDERERS ====================
    function renderHeader() {
      let totalTasks = 0;
      let completedCount = 0;
      SYLLABUS_DATA.forEach(d => {
        totalTasks += d.tasks.length;
        d.tasks.forEach((_, idx) => {
          if (state.completedTasks.has(`${d.month}-${d.day}-${idx}`)) completedCount++;
        });
      });
      const pct = totalTasks > 0 ? Math.round((completedCount / totalTasks) * 100) : 0;

      document.getElementById('progressText').textContent = `Overall Completion: ${completedCount} / ${totalTasks} tasks completed`;
      document.getElementById('progressPct').textContent = `${pct}%`;
      document.getElementById('progressBarFill').style.width = `${pct}%`;
    }

    function renderTabs() {
      const container = document.getElementById('monthTabs');
      let html = '';
      for (let i = 0; i <= 6; i++) {
        const isActive = state.selectedMonth === i;
        const label = i === 0 ? 'All 168 Days' : `Month ${i}`;
        html += `<button type="button" class="tab-btn ${isActive ? 'is-active' : ''}" onclick="setMonth(${i})">${label}</button>`;
      }
      container.innerHTML = html;
    }

    function renderSchedule() {
      const container = document.getElementById('contentArea');
      if (!container) return;

      const query = state.searchQuery.trim().toLowerCase();
      const filtered = SYLLABUS_DATA.filter(item => {
        const matchesMonth = (state.selectedMonth === 0) || (item.month === state.selectedMonth);
        if (!matchesMonth) return false;
        if (!query) return true;
        const inTitle = item.title.toLowerCase().includes(query);
        const inTrack = item.track.toLowerCase().includes(query);
        const inTasks = item.tasks.some(t => t.toLowerCase().includes(query));
        return inTitle || inTrack || inTasks;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <p style="font-size:20px;font-weight:600;margin:0 0 4px 0;">No topics found</p>
            <p style="margin:0;">Try adjusting your search terms or selecting another month tab.</p>
          </div>`;
        return;
      }

      const groups = {};
      filtered.forEach(item => {
        const key = `${item.month}-${item.week}`;
        if (!groups[key]) groups[key] = [];
        groups[key].push(item);
      });

      const sortedKeys = Object.keys(groups).sort((a, b) => {
        const [ma, wa] = a.split('-').map(Number);
        const [mb, wb] = b.split('-').map(Number);
        return ma !== mb ? ma - mb : wa - wb;
      });

      let html = '';
      sortedKeys.forEach(key => {
        const days = groups[key];
        const [month, weekNum] = key.split('-').map(Number);
        const collapseKey = `${month}-${weekNum}`;
        const isCollapsed = state.collapsedWeeks.has(collapseKey);

        let weekTotal = 0, weekDone = 0;
        days.forEach(d => {
          d.tasks.forEach((_, idx) => {
            weekTotal++;
            if (state.completedTasks.has(`${d.month}-${d.day}-${idx}`)) weekDone++;
          });
        });
        const weekPct = weekTotal > 0 ? Math.round((weekDone / weekTotal) * 100) : 0;

        html += `
          <div class="week-group">
            <div class="week-header" onclick="toggleWeek(${month}, ${weekNum})">
              <div class="week-title">
                <span class="week-toggle-icon">${isCollapsed ? '+' : '−'}</span>
                <span>Month ${month} — Week ${weekNum}</span>
              </div>
              <div class="week-meta">
                ${weekDone}/${weekTotal} Tasks (${weekPct}%)
              </div>
            </div>
            <div class="week-group-content" style="display: ${isCollapsed ? 'none' : 'block'};">
              <div class="day-list">
                ${days.map(d => renderDayItem(d)).join('')}
              </div>
            </div>
          </div>`;
      });

      container.innerHTML = html;
    }

    function renderDayItem(d) {
      return `
        <div class="day-item">
          <div class="day-header-row">
            <div class="day-meta">
              <span class="day-badge">DAY ${d.day}</span>
              <span class="track-badge">${d.track}</span>
            </div>
            <div class="day-title">${d.title}</div>
          </div>
          <div class="task-list">
            ${d.tasks.map((taskText, idx) => {
              const isChecked = state.completedTasks.has(`${d.month}-${d.day}-${idx}`);
              return `
                <label class="task-item ${isChecked ? 'is-completed' : ''}">
                  <input type="checkbox" class="task-checkbox" ${isChecked ? 'checked' : ''} 
                    onchange="toggleTask(${d.month}, ${d.day}, ${idx})">
                  <span class="task-label">${taskText}</span>
                </label>`;
            }).join('')}
          </div>
          ${renderStudyResources(d)}
        </div>`;
    }

    function updateViz() {
      try { renderHeader(); } catch (e) { console.error(e); }
      try { renderTabs(); } catch (e) { console.error(e); }
      try { renderSchedule(); } catch (e) { console.error(e); }
    }

    // ==================== EVENTS ====================
    document.getElementById('searchInput')?.addEventListener('input', (e) => {
      state.searchQuery = e.target.value;
      updateViz();
    });

    document.getElementById('printBtn')?.addEventListener('click', () => {
      window.print();
    });

    // ==================== THEME ====================
    function applyTheme(theme) {
      if (theme === 'dark' || theme === 'light') {
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.setProperty('color-scheme', theme);
      }
    }

    if (!document.documentElement.hasAttribute('data-theme') && window.matchMedia?.('(prefers-color-scheme: dark)').matches) {
      applyTheme('dark');
    }

    window.addEventListener('message', (e) => {
      if (e.data?.type === 'set-theme' || e.data?.type === 'APPLY_THEME') {
        applyTheme(e.data.theme);
      }
    });

    // ==================== AUTO-RESIZE NOTIFY ====================
    (function autoResize() {
      function notifyHeight() {
        const c = document.querySelector('.widget-container') || document.body;
        if (!c) return;
        const h = Math.ceil(Math.max(c.getBoundingClientRect().bottom, c.scrollHeight));
        window.parent.postMessage({ type: 'widget-resize', height: h }, '*');
      }
      window.addEventListener('load', () => setTimeout(notifyHeight, 120));
      if (window.ResizeObserver) {
        new ResizeObserver(() => notifyHeight()).observe(document.querySelector('.widget-container') || document.body);
      }
    })();

    // ==================== INIT ====================
    updateViz();
  </script>
</body>
</html>
